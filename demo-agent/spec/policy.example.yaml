account:
  chain: tempo
  default_fee_token: pathUSD
  sponsored_fees: true
  prefer_tempo_transactions: true

runtime_key:
  type: access_key
  expires_in_hours: 24
  token_limits:
    pathUSD: 25000000

task_policy:
  max_trip_budget_usd: 1500
  max_search_spend_usd: 2
  require_destination: true
  require_date_range: true
  require_budget: true

travel_policy:
  allow_red_eye_default: false
  max_hotel_nights: 3
  default_currency: USD
  return_top_options: 3

services:
  flight-search-gateway:
    allow: true
    service_type: flight_search
    mpp_method: tempo
    intent: charge
    max_amount_per_call: 500000
    timeout_ms: 12000

  hotel-search-gateway:
    allow: true
    service_type: hotel_search
    mpp_method: tempo
    intent: charge
    max_amount_per_call: 500000
    timeout_ms: 12000

  maps-gateway:
    allow: true
    service_type: commute_enrichment
    mpp_method: tempo
    intent: charge
    max_amount_per_call: 200000
    timeout_ms: 8000

swaps:
  allow: false
  max_slippage_bps: 50
  max_notional: 1000000

logging:
  store_payment_receipts: true
  store_service_payload_hashes: true
  redact_user_pii: true
